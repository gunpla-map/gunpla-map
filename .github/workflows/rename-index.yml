name: Rename uploaded file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv -f ganpurafan-mai-dian-matupu-yi-bie-matome.html index.html
          git add index.html ganpurafan-mai-dian-matupu-yi-bie-matome.html
          git commit -m "トップページの桜木町カード画像を修正"
          git push
