name: Copy ueno file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to ueno.html
        run: |
          cp "jrshang-ye-yi-ganpurafan-mai-dian-matupu.html" "ueno.html"
          git config user.name "gunpla-map"
          git config user.email "gunpla-map@users.noreply.github.com"
          git add ueno.html
          git commit -m "Add ueno.html"
          git push
