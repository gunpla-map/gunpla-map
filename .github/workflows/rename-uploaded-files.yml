name: Rename uploaded files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename uploaded files
        run: |
          git config user.name "gunpla-map"
          git config user.email "gunpla-map@users.noreply.github.com"
          mv jrxin-su-yi-ganpurafan-mai-dian-matupu.html shinjuku.html
          mv jrshibui-gu-yi-ganpurafan-mai-dian-matupu.html shibuya.html
          mv jrqiu-xie-yuan-yi-ganpurafan-mai-dian-matupu.html akihabara.html
          mv jrchi-dai-yi-ganpurafan-mai-dian-matupu.html ikebukuro.html
          mv jrshang-ye-yi-ganpurafan-mai-dian-matupu.html ueno.html
          mv jr-3.html yokohama.html
          mv jr.html kawasaki.html
          git add -A
          git status --porcelain
          git commit -m "アップロードしたファイルを目的のファイル名にリネーム"
          git push
