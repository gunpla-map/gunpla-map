name: Rename uploaded files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded files
        run: |
          mv jrqiu-xie-yuan-yi-ganpurafan-mai-dian-matupu.html akihabara.html
          mv jrxin-su-yi-ganpurafan-mai-dian-matupu.html shinjuku.html
          mv jrchi-dai-yi-ganpurafan-mai-dian-matupu.html ikebukuro.html
          mv jrshibui-gu-yi-ganpurafan-mai-dian-matupu.html shibuya.html
          mv jrshang-ye-yi-ganpurafan-mai-dian-matupu.html ueno.html
          mv jrjin-mi-ting-yi-ganpurafan-mai-dian-matupu.html kinshicho.html
          mv jryu-du-gong-yi-ganpurafan-mai-dian-matupu.html utsunomiya.html
          mv jrda-sen-yi-ganpurafan-mai-dian-matupu.html omori.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename uploaded files" || echo "nothing to commit"
          git push
