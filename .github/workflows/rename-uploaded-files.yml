name: Rename uploaded files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv -f ganpurafan-mai-dian-matupu-yi-bie-matome.html index.html
          mv -f jr.html kawasaki.html
          mv -f jr-2.html sakuragicho.html
          mv -f jr-3.html yokohama.html
          mv -f jrshang-ye-yi-ganpurafan-mai-dian-matupu.html ueno.html
          mv -f jrqiu-xie-yuan-yi-ganpurafan-mai-dian-matupu.html akihabara.html
          mv -f jrxin-su-yi-ganpurafan-mai-dian-matupu.html shinjuku.html
          mv -f jrshibui-gu-yi-ganpurafan-mai-dian-matupu.html shibuya.html
          mv -f jrchi-dai-yi-ganpurafan-mai-dian-matupu.html ikebukuro.html
          git add -A
          git diff --cached --quiet || git commit -m "アップロードしたファイルを目的のファイル名にリネーム"
          git push
