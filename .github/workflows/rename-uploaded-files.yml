name: Rename uploaded files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv ganpurafan-mai-dian-matupu-yi-bie-matome.html index.html
          git mv jrda-chuan-yi-ganpurafan-mai-dian-matupu.html ofuna.html
          git commit -m "Rename uploaded files to index.html and ofuna.html"
          git push
